name: Weekly deal-tracker update

# Runs every Monday 07:00 UTC, and can be run on demand from the Actions tab.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write   # lets the action commit the refreshed data + built page

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull new deals from the newsletters (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: override the model, e.g. claude-opus-4-1
          TRACKER_MODEL: ${{ vars.TRACKER_MODEL }}
        run: python weekly_update.py

      - name: Rebuild the dashboard
        run: python build.py

      - name: Commit refreshed data + page
        run: |
          git config user.name  "deal-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ public/
          if git diff --staged --quiet; then
            echo "No changes this week."
          else
            git commit -m "Weekly update: $(date -u +%Y-%m-%d)"
            git push
          fi
      # The push above triggers the "Deploy to GitHub Pages" workflow, which republishes the site.
